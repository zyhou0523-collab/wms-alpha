server:
  port: 8080

spring:
  application:
    name: wms-alpha-backend
  datasource:
    url: ${WMS_DB_URL:jdbc:mysql://localhost:3306/wms_alpha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WMS_DB_USER:root}
    password: ${WMS_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

wms:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
