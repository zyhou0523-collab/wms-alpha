server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${WMS_DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wms_alpha}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WMS_DB_USER:${MYSQL_USERNAME:root}}
    password: ${WMS_DB_PASSWORD:${MYSQL_PASSWORD:123456}}
  sql:
    init:
      mode: never

wms:
  cors:
    allowed-origins: ${WMS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
